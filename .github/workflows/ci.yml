name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run lint
        run: ruff check src
      - name: Run format check
        run: ruff format --check src
      - name: Run tests
        run: pytest tests

  native-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools and dev dependencies
        run: |
          pip install cmake ninja pybind11 scikit-build-core pytest pytest-asyncio
          pip install -e ".[dev]" --no-build-isolation
      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFORGEX_BUILD_PYTHON=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Copy native extension
        shell: pwsh
        run: |
          $pyd = Get-ChildItem -Path build -Filter "_native*.pyd" -Recurse | Select-Object -First 1
          if (-not $pyd) { Write-Error "Native extension not found in build/"; exit 1 }
          Copy-Item $pyd.FullName src/forgex/
      - name: Test Native Extension
        run: pytest tests/unit/test_native_engine.py
