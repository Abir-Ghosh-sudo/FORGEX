
[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"


[project]
name = "forgex-ai"
version = "1.0.0"
description = "FORGEX - Build Beyond Code. An autonomous terminal-first AI coding agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

authors = [
    { name = "FORGEX Contributors" },
]

keywords = [
    "ai",
    "coding-agent",
    "autonomous-agent",
    "developer-tools",
    "terminal",
    "llm",
    "code-assistant",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "platformdirs>=4.3",
    "httpx>=0.27",
    "gitpython>=3.1",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.10",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "huggingface-hub>=0.26",
    "tokenizers>=0.20",
]


[project.optional-dependencies]

local = [
    "ollama>=0.4",
]

transformers = [
    "transformers>=4.45",
    "accelerate>=1.0",
    "safetensors>=0.4",
]

mcp = [
    "mcp>=1.0",
]

vector = [
    "chromadb>=0.5",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "build>=1.2",
]


[project.scripts]
forgex = "forgex.cli.app:main"


[tool.scikit-build]
wheel.packages = ["src/forgex"]
cmake.version = ">=3.24"
build-dir = "build/{wheel_tag}"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

addopts = [
    "-ra",
    "--strict-markers",
]


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
check_untyped_defs = true
namespace_packages = true
mypy_path = "src"


[tool.coverage.run]
branch = true
source = ["forgex"]


[tool.coverage.report]
show_missing = true
skip_covered = true
