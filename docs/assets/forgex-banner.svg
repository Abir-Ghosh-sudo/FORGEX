<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">FORGEX — Build Beyond Code</title>
<desc id="desc">FORGEX mascot, a compact coding robot holding a terminal, in neon cyan and electric purple on a dark background.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070d"/><stop offset=".55" stop-color="#090d1a"/><stop offset="1" stop-color="#13091e"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20DDF5"/><stop offset=".5" stop-color="#4388ff"/><stop offset="1" stop-color="#B13CFF"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0b2230"/><stop offset="1" stop-color="#1b1230"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#24304a" stroke-opacity=".28"/></pattern>
</defs>
<rect width="1600" height="560" rx="28" fill="url(#bg)"/><rect width="1600" height="560" rx="28" fill="url(#grid)"/>
<circle cx="1270" cy="120" r="260" fill="#8b2be2" opacity=".08"/><circle cx="170" cy="470" r="260" fill="#06b6d4" opacity=".08"/>
<!-- orbital sweep -->
<path d="M115 300C190 125 405 100 565 180M1035 150C1190 70 1390 150 1455 290" fill="none" stroke="url(#neon)" stroke-width="5" opacity=".8"/>
<!-- robot mascot -->
<g transform="translate(170 82)" filter="url(#glow)">
  <path d="M150 55L185 18L220 55" fill="none" stroke="url(#neon)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165 72H205" stroke="#B13CFF" stroke-width="12" stroke-linecap="round"/>
  <rect x="75" y="78" width="220" height="158" rx="42" fill="#0a1020" stroke="url(#neon)" stroke-width="12"/>
  <rect x="45" y="128" width="30" height="62" rx="12" fill="#20DDF5"/><rect x="295" y="128" width="30" height="62" rx="12" fill="#B13CFF"/>
  <rect x="125" y="130" width="25" height="48" rx="9" fill="#20DDF5"/><rect x="220" y="130" width="25" height="48" rx="9" fill="#D98BFF"/>
  <path d="M145 205Q185 226 225 205" fill="none" stroke="#8ca3c8" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 250L70 280M260 250L300 280" stroke="url(#neon)" stroke-width="17" stroke-linecap="round"/>
  <rect x="75" y="270" width="220" height="125" rx="18" fill="url(#screen)" stroke="url(#neon)" stroke-width="9"/>
  <path d="M137 312L165 332L137 352M185 355L208 307M230 352L258 332L230 312" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M65 285L38 315M305 285L332 315" stroke="url(#neon)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="25" cy="95" r="7" fill="#20DDF5"/><rect x="335" y="75" width="13" height="13" fill="#B13CFF"/><rect x="355" y="115" width="8" height="8" fill="#20DDF5"/>
</g>
<g transform="translate(600 170)">
  <text x="0" y="105" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="112" font-weight="850" letter-spacing="3">FORGE<tspan fill="#B13CFF">X</tspan></text>
  <text x="8" y="165" fill="#20DDF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="10">AI CODING AGENT</text>
  <path d="M8 190H690" stroke="url(#neon)" stroke-width="3"/>
  <text x="8" y="245" fill="#a7b0c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" letter-spacing="2">PLAN  •  CODE  •  TEST  •  IMPROVE</text>
  <text x="8" y="315" fill="#e6edf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="650">Build Beyond Code.</text>
  <text x="8" y="360" fill="#8492a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Open-source · Terminal-first · Model-flexible</text>
</g>
<text x="1510" y="520" fill="#66758d" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">WINDOWS  ·  LINUX</text>
</svg>